<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>The Wave</title>
  <link rel="stylesheet" href="css/game1.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Main menu -->
  <section id="menu" class="screen">
    <h1>THE WAVE</h1>
    <p class="sub">Hold to go up. Let go to go down.</p>
    <div class="stack">
      <button id="btnPlay" class="primary">Play</button>
      <button id="btnCreate">Create</button>
    </div>
    <p class="hint">Mouse, touch, Space or ↑ to fly. Esc to leave a level.</p>
  </section>

  <!-- Level select -->
  <section id="levels" class="screen hidden">
    <h2>Levels</h2>
    <div id="levelGrid" class="level-grid"></div>
    <button class="back" data-go="menu">Back</button>
  </section>

  <!-- Create mode: my levels -->
  <section id="mylevels" class="screen hidden">
    <h2>Create</h2>
    <div class="row">
      <button id="btnNewLevel" class="primary">New level</button>
      <button id="btnImport">Import code</button>
    </div>
    <ul id="customList" class="custom-list"></ul>
    <p id="customEmpty" class="hint">You haven't made any levels yet.</p>
    <button class="back" data-go="menu">Back</button>
  </section>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <button id="btnQuit" class="icon" aria-label="Leave level">✕</button>
    <div class="hud-mid">
      <div id="hudName"></div>
      <div class="progress"><div id="progressFill"></div></div>
    </div>
    <div class="hud-right"><span id="hudPct">0%</span><span id="hudAttempt"></span></div>
  </div>

  <!-- In-game message -->
  <div id="msg" class="hidden">
    <h2 id="msgTitle"></h2>
    <p id="msgSub"></p>
    <div id="msgButtons" class="row"></div>
    <p id="msgPrompt" class="hint"></p>
  </div>

  <!-- Editor UI -->
  <div id="edTop" class="ed-bar hidden">
    <button id="edBack">Back</button>
    <input id="edName" type="text" maxlength="30" placeholder="Level name">
    <button id="edSave">Save</button>
    <button id="edTest" class="primary">▶ Test</button>
  </div>
  <div id="edBottom" class="ed-bar hidden">
    <div class="tools">
      <button class="tool" data-tool="block" title="Block (1)"><span class="swatch block"></span>Block</button>
      <button class="tool" data-tool="slope" title="Slope (2)"><span class="swatch slope"></span>Slope</button>
      <button class="tool" data-tool="spike" title="Spike (3)"><span class="swatch spike"></span>Spike</button>
      <button class="tool" data-tool="boost" title="Speed booster (4)"><span class="boost-ico">›››</span>Booster</button>
      <button class="tool" data-tool="erase" title="Eraser (5)">⌫ Erase</button>
      <button class="tool" data-tool="pan" title="Move view (6)">✋ Move</button>
      <button id="edDir" title="Rotate slope / spike, or change booster speed (R)">⟳ ◣</button>
      <label class="speed">Speed
        <select id="edSpeed">
          <option value="330">Slow</option>
          <option value="400" selected>Normal</option>
          <option value="470">Fast</option>
          <option value="540">Very fast</option>
        </select>
      </label>
      <label class="speed">Length
        <button id="edLenMinus" class="mini" title="Shorter">−</button>
        <input id="edLength" type="number" min="10" step="10" value="60" inputmode="numeric">
        <button id="edLenPlus" class="mini" title="Longer">+</button>
      </label>
      <button id="edClear">Clear</button>
    </div>
    <div class="scroll-row">
      <button id="edGoStart" class="mini" title="Go to start (Home)">⇤</button>
      <input id="edScroll" type="range" min="0" max="100" value="0" aria-label="Scroll level">
      <button id="edGoEnd" class="mini" title="Go to finish (End)">⇥</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="js/levels.js"></script>
  <script src="js/game1.js"></script>
</body>
</html>
