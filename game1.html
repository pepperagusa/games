<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>The Wave</title>
  <link rel="stylesheet" href="css/game1.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
    <div class="stat right"><span class="label">Best</span><span id="best">0</span></div>
  </div>

  <div id="overlay">
    <h1 id="title">THE WAVE</h1>
    <p id="subtitle">Hold to go up. Let go to go down.</p>
    <p id="prompt">Tap, click or press Space to start</p>
  </div>

  <script src="js/game1.js"></script>
</body>
</html>
